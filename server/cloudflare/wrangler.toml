name = "rai-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# The RAI keeps its data in rai_ tables inside the existing SMART database, so
# SMART accounts (the `users` table) can be used to log in. This worker creates
# and writes only rai_ tables; it reads `users` and nothing else.
[[d1_databases]]
binding = "DB"
database_name = "smart"
database_id = "46bf17c9-c3ab-4edf-95b2-a707c24a14d8"

# Optional: let accounts from another SMART database log in too (study setting
# accountDb = "DB_CARINA"). Their RAI data is still stored in the database above.
# [[d1_databases]]
# binding = "DB_CARINA"
# database_name = "smart-carina"
# database_id = "a5792408-df1f-4c0f-a8ef-ef378d7772a6"

[vars]
# Comma-separated origins allowed to call the API, or "*" while testing.
ALLOWED_ORIGINS = "https://jamiecummins.github.io,http://localhost:8080"
# Sender of login-code emails. Must be an address on a domain verified in Resend;
# the default below only delivers to the Resend account's own address.
MAIL_FROM = "RAI <onboarding@resend.dev>"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put AUTH_SECRET      (any long random string; not the SMART one)
#   npx wrangler secret put ADMIN_TOKEN      (password for admin.html)
#   npx wrangler secret put RESEND_API_KEY   (only needed for studies that log in by email)
